name: Build and push Docker image to ACR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, pdo, pdo_mysql

      - name: Install Dependencies
        run: |
          cd gearis
          if [ -f composer.json ]; then 
            composer install --no-progress --prefer-dist
          else
            # Jeśli nie macie composer.json, pobieramy PHPUnit bezpośrednio jako plik .phar na potrzeby testów
            curl -sSL https://phar.phpunit.de/phpunit-10.phar -o phpunit
            chmod +x phpunit
          fi

      - name: Run Unit Tests
        run: |
          cd gearis
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit --configuration phpunit.xml
          elif [ -f phpunit ]; then
            ./phpunit --configuration phpunit.xml
          else
            echo "Nie znaleziono PHPUnit, pomijam uruchamianie testów."
          fi

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: gearis2026.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          docker build -t gearis2026.azurecr.io/gearis-app:latest -f gearis/Dockerfile gearis/
          docker push gearis2026.azurecr.io/gearis-app:latest
